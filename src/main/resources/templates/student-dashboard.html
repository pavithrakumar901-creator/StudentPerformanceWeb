<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6fb;
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 22px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 26px;
        }

        .logout {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .logout:hover {
            background: #f0f0f0;
        }

        /* ================= CONTAINER ================= */

        .container {
            padding: 40px;
        }

        /* ================= WELCOME ================= */

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #777;
            font-size: 16px;
        }

        /* ================= CARD ================= */

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                    0 5px 20px
                    rgba(0, 0, 0, 0.1);

            overflow-x: auto;
        }

        .table-card h3 {
            color: #333;
            margin-bottom: 20px;
        }

        /* ================= TABLE ================= */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: center;
        }

        td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #444;
        }

        tr:hover {
            background: #f5f6ff;
        }

        /* ================= ERROR ================= */

        .error {
            background: #ffe5e5;
            color: #d8000c;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                padding: 20px;
            }

        }

    </style>

</head>

<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <h1>
        Student Performance Prediction System
    </h1>

    <a href="/" class="logout">
        Logout
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="container">


    <!-- ================= WELCOME ================= -->

    <div class="welcome">

        <h2>
            Student Dashboard
        </h2>

        <p>
            Welcome,
            <strong th:text="${username}">
                Student
            </strong>!
            You have successfully logged in.
        </p>

    </div>


    <!-- ================= ERROR MESSAGE ================= -->

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>


    <!-- ================= STUDENT DATA ================= -->

    <div class="table-card"
         th:if="${student != null}">

        <h3>
            📊 My Performance Details
        </h3>


        <table>

            <thead>

            <tr>

                <th>Student ID</th>

                <th>Name</th>

                <th>Department</th>

                <th>Attendance</th>

                <th>Internal Mark</th>

                <th>Assignment Mark</th>

                <th>Previous Mark</th>

                <th>Study Hours</th>

            </tr>

            </thead>


            <tbody>

            <tr>

                <td th:text="${student.studentId}">
                    -
                </td>

                <td th:text="${student.name}">
                    -
                </td>

                <td th:text="${student.department}">
                    -
                </td>

                <td th:text="${student.attendance}">
                    -
                </td>

                <td th:text="${student.internalMark}">
                    -
                </td>

                <td th:text="${student.assignmentMark}">
                    -
                </td>

                <td th:text="${student.previousMark}">
                    -
                </td>

                <td th:text="${student.studyHours}">
                    -
                </td>

            </tr>

            </tbody>

        </table>

    </div>


</div>


</body>

</html>
