<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6fb;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 22px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .back {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .full {
            grid-column: span 2;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #5568d9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f4f6fb;
        }

        .admin {
            color: #764ba2;
            font-weight: bold;
        }

        .student {
            color: #667eea;
            font-weight: bold;
        }

        .delete {
            background: #e74c3c;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .delete:hover {
            background: #c0392b;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 700px) {

            .container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 9px;
            }
        }

    </style>

</head>

<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <h1>
        Student Performance Prediction System
    </h1>

    <a href="/admin/dashboard" class="back">
        ← Back
    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="container">


    <!-- ================= ADD USER ================= -->

    <div class="card">

        <h2>
            👤 Add New User
        </h2>

        <form action="/admin/users/add"
              method="post">

            <div class="form-grid">


                <!-- USERNAME -->

                <div>

                    <label for="username">
                        Username
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Enter username"
                           required>

                </div>


                <!-- PASSWORD -->

                <div>

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter password"
                           required>

                </div>


                <!-- ROLE -->

                <div>

                    <label for="role">
                        Role
                    </label>

                    <select id="role"
                            name="role"
                            onchange="toggleStudentId()"
                            required>

                        <option value="">
                            -- Select Role --
                        </option>

                        <option value="ADMIN">
                            ADMIN
                        </option>

                        <option value="STUDENT">
                            STUDENT
                        </option>

                    </select>

                </div>


                <!-- STUDENT ID -->

                <div id="studentIdBox">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input type="number"
                           id="studentId"
                           name="studentId"
                           placeholder="Enter Student ID">

                </div>


                <!-- SUBMIT -->

                <div class="full">

                    <button type="submit"
                            class="btn">

                        ➕ Add User

                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- ================= USERS TABLE ================= -->

    <div class="card">

        <h2>
            👥 Registered Users
        </h2>

        <table>

            <thead>

            <tr>

                <th>User ID</th>

                <th>Username</th>

                <th>Role</th>

                <th>Student ID</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.userId}">
                </td>

                <td th:text="${user.username}">
                </td>

                <td>

                    <span th:if="${user.role == 'ADMIN'}"
                          class="admin">

                        ADMIN

                    </span>

                    <span th:if="${user.role == 'STUDENT'}"
                          class="student">

                        STUDENT

                    </span>

                </td>

                <td th:text="${user.studentId != null ? user.studentId : '-'}">
                </td>

                <td>

                    <a th:href="@{/admin/users/delete/{id}(id=${user.userId})}"
                       class="delete"
                       onclick="return confirm('Are you sure you want to delete this user?');">

                        Delete

                    </a>

                </td>

            </tr>


            <!-- NO USERS -->

            <tr th:if="${#lists.isEmpty(users)}">

                <td colspan="5"
                    class="empty">

                    No users found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

    function toggleStudentId() {

        const role =
            document.getElementById("role").value;

        const studentId =
            document.getElementById("studentId");

        if (role === "STUDENT") {

            studentId.required = true;

        } else {

            studentId.required = false;
            studentId.value = "";

        }

    }

</script>


</body>

</html>
