<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
</head>
<body>

<h2>Add Student</h2>

<form th:action="@{/admin/students/add}" th:object="${student}" method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required>
    <br><br>

    <label>Department:</label>
    <input type="text" th:field="*{department}" required>
    <br><br>

    <label>Attendance:</label>
    <input type="number" step="0.01" th:field="*{attendance}" required>
    <br><br>

    <label>Internal Mark:</label>
    <input type="number" step="0.01" th:field="*{internalMark}" required>
    <br><br>

    <label>Assignment Mark:</label>
    <input type="number" step="0.01" th:field="*{assignmentMark}" required>
    <br><br>

    <label>Previous Mark:</label>
    <input type="number" step="0.01" th:field="*{previousMark}" required>
    <br><br>

    <label>Study Hours:</label>
    <input type="number" step="0.1" th:field="*{studyHours}" required>
    <br><br>

    <button type="submit">Add Student</button>

</form>

</body>
</html>
